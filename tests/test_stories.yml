version: "3.1"

stories:

  - story: Тест — кандидат выбирает роль Data Scientist
    steps:
      - user: |
          Привет
        intent: greet
      - action: utter_greet

      - user: "/provide_info"
        intent: provide_info
      - action: hr_form
      - active_loop: hr_form

      - action: utter_ask_role

      - user: |
          Я хочу работать Data Scientist
        intent: provide_desired_role
        entities:
          - role: "Data Scientist"
      - action: action_extract_role

      - user: |
          У меня 3 года опыта
        intent: provide_experience
        entities:
          - experience: "3 года"
      - action: action_extract_experience

      - user: |
          Я знаю Python и SQL
        intent: provide_skills
        entities:
          - skills: ["Python", "SQL"]
      - action: action_extract_skills

      - user: |
          Ожидаю зарплату 150к рублей
        intent: provide_salary_expectation
        entities:
          - salary: "150000"
      - action: action_extract_salary

      - action: hr_form
      - active_loop: null
      - action: action_evaluate_candidate
