version: "3.1"
stories:
  - story: Приветствие и вакансии
    steps:
      - user: |
          Привет
        intent: greet
      - action: action_reset_slots
      - action: utter_greet
      - action: utter_ask_action
      - user: |
          Какие вакансии у вас есть?
        intent: ask_about_roles
      - action: utter_available_roles
  - story: Связь с рекрутером
    steps:
      - user: |
          Можно ли поговорить с HR?
        intent: request_human
      - action: utter_contact_hr
  - story: Перезапуск
    steps:
      - user: |
          /restart
        intent: restart
      - action: action_restart
      - action: utter_ask_action
