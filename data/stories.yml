#      - action: action_reset_slots  # reset слотов
#      - action: hr_form
#      - active_loop: hr_form

  - story: Пользователь разговаривает с HR и уходит
    steps:
      - intent: request_human
      - action: utter_contact_hr
      - action: utter_ask_action

      - user: "/goodbye"
        intent: goodbye
      - action: utter_goodbye
