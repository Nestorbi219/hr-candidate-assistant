version: "3.1"

stories:
  - story: Пользователь
    steps:
      - intent: greet
      - actions: utter_greet
      - intent: ask_about_roles
      - actions: utter_available_roles
      - intent: provide_desired_role
      - actions: utter_ask_skills
      - intent: provide_skills
      - actions: utter_ask_experience
      - intent: provide_experience
      - actions: utter_ask_salary
      - intent: provide_salary_expectation
      - actions: action_evaluate_candidate
      - intent: goodbye
      - actions: utter_goodbye

  - story: Пользователь выбирает действие
    steps:
      - intent: choose_action
      - action: utter_ask_action

  - story: Пользователь хочет оставить информацию
    steps:
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - story: Пользователь хочет узнать про вакансии
    steps:
      - intent: ask_about_roles
      - action: utter_available_roles

  - story: Пользователь хочет подать заявку заново
    steps:
      - intent: provide_info_again
      - action: action_reset_slots  # reset слотов
      - action: hr_form
      - active_loop: hr_form

  - story: Пользователь разговаривает с HR и уходит
    steps:
      - intent: request_human
      - action: utter_contact_hr
      - action: utter_ask_action

      - user: "/goodbye"
        intent: goodbye
      - action: utter_goodbye
