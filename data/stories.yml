version: "3.1"

stories:
  - story: Пользователь просматривает доступные вакансии и подает заявку
    steps:
      - intent: greet
      - action: action_reset_slots
      - action: utter_greet
      - action: utter_ask_action
      - intent: ask_about_roles
      - action: utter_available_roles
      - intent: provide_desired_role
      - action: hr_form
      - active_loop: hr_form
      - active_loop: null
      - action: action_extract_experience
      - action: action_extract_salary
      - action: utter_application_summary
      - action: action_evaluate_candidate
      - intent: goodbye
      - action: utter_goodbye

  - story: Пользователь сразу оставляет заявку
    steps:
      - intent: greet
      - action: action_reset_slots
      - action: utter_greet
      - action: utter_ask_action
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form
      - active_loop: null
      - action: action_extract_experience
      - action: action_extract_salary
      - action: utter_application_summary
      - action: action_evaluate_candidate
      - intent: goodbye
      - action: utter_goodbye

  - story: Пользователь хочет заново запустить после заполнения формы
    steps:
      - intent: greet
      - action: action_reset_slots
      - action: utter_greet
      - action: utter_ask_action
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form
      - active_loop: null
      - action: action_extract_experience
      - action: action_extract_salary
      - action: utter_application_summary
      - action: action_evaluate_candidate
      - intent: restart
      - action: action_restart
      - action: utter_ask_action

  - story: Пользователь разговаривает с HR и уходит
    steps:
      - intent: greet
      - action: action_reset_slots
      - action: utter_greet
      - action: utter_ask_action
      - intent: request_human
      - action: utter_contact_hr
      - action: utter_ask_action
      - intent: goodbye
      - action: utter_goodbye
