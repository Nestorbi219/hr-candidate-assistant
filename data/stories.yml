version: "3.1"

stories:
  - story: Пользователь выбирает действие
    steps:
      - intent: choose_action
      - action: utter_ask_action

  - story: Пользователь хочет оставить информацию
    steps:
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - story: Пользователь хочет узнать про вакансии
    steps:
      - intent: ask_about_roles
      - action: utter_available_roles

  - story: Пользователь хочет подать заявку заново
    steps:
      - intent: provide_info_again
      - action: action_reset_slots  # reset слотов
      - action: hr_form
      - active_loop: hr_form


  - story: Пользователь спрашивает про процесс найма, потом подает заявку
    steps:
      - intent: ask_about_process
      - action: utter_process_details
      - action: utter_ask_action

      - user: "/provide_info"
        intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - story: Пользователь разговаривает с HR и уходит
    steps:
      - intent: request_human
      - action: utter_contact_hr
      - action: utter_ask_action

      - user: "/goodbye"
        intent: goodbye
      - action: utter_goodbye

  - story: Пользователь прощается
    steps:
      - intent: goodbye
      - action: utter_goodbye
