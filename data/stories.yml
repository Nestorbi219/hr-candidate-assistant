      - intent: goodbye
      - action: utter_goodbye

  - story: Благодарность пользователя
    steps:
      - intent: thank_you
      - action: utter_thank_you

  - story: Пользователь говорит "Спасибо, до свидания"
    steps:
      - intent: goodbye
      - action: utter_thank_you
      - action: utter_goodbye

