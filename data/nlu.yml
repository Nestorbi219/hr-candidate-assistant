version: "3.1"

regex_features:
  - name: experience
    pattern: "([0-9]+\\s?(год|лет|месяц|месяцев)?)"


nlu:
  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день
      - Добрый вечер
      - Приветствую
      - Здорово

  - intent: provide_info
    examples: |
      - Хочу податься
      - хочу подать заявку
      - Я хочу оставить информацию о себе
      - Давайте начнем
      - Хочу заполнить анкету
      - Можно оставить заявку?
      - Запишите мои данные
      - Давай
      - Готов ответить на вопросы

  - intent: goodbye
    examples: |
      - спасибо до свидания
      - До свидания
      - Пока
      - Всего хорошего
      - Удачи
      - До встречи
      - Прощайте
      - Я ухожу
      - Ладно, пока
      - Больше вопросов нет, спасибо
      - Чао

  - intent: thank_you
    examples: |
      - Спасибо
      - Большое спасибо
      - Благодарю
      - Спасибо за информацию
      - Очень благодарен
      - Спасибо за помощь
      - Благодарю за ответ
      - Спасибо вам!
      - Вы мне очень помогли
      - Огромное спасибо
      - Благодарствую
      - Спасибочки

  - intent: provide_experience
    examples: |
      - [2 месяца](experience)
      - я работал [полтора года](experience)
      - [6 месяцев](experience) в компании
      - У меня [5 лет](experience) опыта работы
      - Я работал [3 года](experience) в IT
      - Опыт работы [10 лет](experience)
      - У меня [7 лет](experience) стажа
      - Я только начинаю, у меня [1 год](experience) опыта
      - Стаж работы [4 года](experience)
      - Опыт работы около [8 лет](experience)
      - [5 лет](experience) в разработке
      - Работал [6 лет](experience) аналитиком
      - Без опыта, только закончил обучение
      - Опыт [2.5 года](experience) в машинном обучении
      - [Год](experience) назад начал карьеру

  - intent: provide_skills
    examples: |
      # Data Scientist
      - Знаю [Python](skills) и [SQL](skills)
      - Опыт работы с [TensorFlow](skills) и [PyTorch](skills)
      - Специализируюсь на [машинном обучении](skills) и [глубоком обучении](skills)
      - Хорошо разбираюсь в [NLP](skills) и [компьютерном зрении](skills)
      - Работаю с [pandas](skills), [NumPy](skills), [scikit-learn](skills)
      - Знаком с [A/B тестированием](skills) и [статистикой](skills)
      - Анализ данных с помощью [Jupyter Notebook](skills)

      # Data Engineer
      - Опыт работы с [Spark](skills) и [Hadoop](skills)
      - Использую [Python](skills) и [SQL](skills) для ETL-процессов
      - Разбираюсь в [Kafka](skills) и [Airflow](skills)
      - Опыт работы с базами данных: [PostgreSQL](skills), [MongoDB](skills)
      - Настраивал пайплайны данных с помощью [AWS Glue](skills)
      - Автоматизировал обработку данных в [Apache Beam](skills)

      # MLOps Engineer
      - Разбираюсь в [Docker](skills) и [Kubernetes](skills)
      - Опыт настройки CI/CD пайплайнов для ML-моделей
      - Использую [MLflow](skills) для управления экспериментами
      - Опыт работы с [TensorFlow Serving](skills) и [TorchServe](skills)
      - Разворачиваю модели в облаке ([AWS SageMaker](skills), [GCP AI Platform](skills))
      - Работаю с инструментами мониторинга ([Prometheus](skills), [Grafana](skills))

      # Project Manager
      - Владею методологиями [Agile](skills) и [Scrum](skills)
      - Работаю с [JIRA](skills) и [Confluence](skills)
      - Опыт управления командой разработчиков
      - Знаю, как вести [roadmap](skills) и [backlog](skills)
      - Умею организовывать [спринты](skills) и ретроспективы


  - intent: provide_salary_expectation
    examples: |
      - ожидаю зп [300к](salary)
      - рассматриваю офферы от [90к](salary)
      - Рассчитываю на [120 тысяч](salary)
      - Моя зарплатная вилка — от [90 до 120 тысяч](salary)
      - Ожидаю [100 тысяч рублей](salary)
      - Хочу получать [150 тысяч в месяц](salary)
      - хотел бы получать [200 тыщ в месяц](salary)
      - [50000](salary)
      - [250000](salary)

  - intent: provide_desired_role
    examples: |
      - Меня заинтересовала позиция[проджект менеджера](role)
      - [пм](role)
      - [дата аналитик](role) идеальная для меня позиция
      - подаюсь к вам на [дата инженера](role)
      - хочу быть [аналитиком](role)
      - претендую на позицию [саентиста](role)
      - Хочу работать [Data Scientist](role)
      - Интересует позиция [Project Manager](role)
      - Хотел бы быть [MLOps Engineer](role)
      - Интересует роль [Data Analyst](role)
      - Думаю, что мне подойдет [Data Engineer](role)

  - intent: ask_about_roles
    examples: |
       - Какие вакансии у вас есть?
       - Какие открытые позиции есть в компании?
       - Какие должности сейчас актуальны?
       - На какие позиции вы ищете людей?
       - Какие специалисты вам нужны?

  - intent: ask_about_process
    examples: |
       - Как проходит процесс отбора?
       - Сколько этапов в собеседовании?
       - Как долго идет найм?
       - Какие тестовые задания даете?
       - Когда будет обратная связь?

  - intent: ask_about_company
    examples: |
       - Чем занимается ваша компания?
       - Какие проекты у вас есть?
       - Какие технологии вы используете?
       - Где находится ваш офис?
       - Можно ли работать удаленно?

  - intent: request_human
    examples: |
      - Можно ли поговорить с HR?
      - Мне нужен живой человек
      - Свяжите меня с рекрутером
      - Хочу поговорить с человеком
      - Это важно, могу поговорить с менеджером?

  - intent: not_sure
    examples: |
      - Я не уверен
      - Не знаю
      - Затрудняюсь ответить
      - Пока не могу сказать

  - intent: not_interested
    examples: |
      - Меня это не интересует
      - Я не заинтересован в этом
      - Я не хочу работать в вашей компании
      - Эта позиция мне не подходит
      - Не думаю, что это для меня
      - Я ищу другое направление

  - intent: no_experience
    examples: |
      - У меня нет опыта
      - Я только начинаю
      - Я новичок в этой сфере
      - Пока не работал в IT
      - Это моя первая работа