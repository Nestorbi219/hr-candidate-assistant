version: "3.0"

nlu:
  # Приветствие
  - intent: greet
    examples: |
      - Привет
      - Здравствуйте
      - Добрый день
      - Добрый вечер
      - Приветствую
      - Здорово

  - intent: provide_info
    examples: |
      - Я хочу оставить информацию о себе
      - Давайте начнем
      - Хочу заполнить анкету
      - Можно оставить заявку?
      - Запишите мои данные

  # Прощание
  - intent: goodbye
    examples: |
      - До свидания
      - Пока
      - Всего хорошего
      - Удачи
      - До встречи

  # Благодарность
  - intent: thank_you
    examples: |
      - Спасибо
      - Большое спасибо
      - Благодарю
      - Спасибо за информацию
      - Очень благодарен

  # Пользователь сообщает об опыте работы
  - intent: provide_experience
    examples: |
      - У меня [5 лет](experience) опыта работы
      - Я работал [3 года](experience) в IT
      - Опыт работы [10 лет](experience)
      - У меня [7 лет](experience) стажа
      - Я только начинаю, у меня [1 год](experience) опыта

  # Пользователь сообщает о навыках
  - intent: provide_skills
    examples: |
      - Знаю [Python](skills) и [SQL](skills)
      - У меня опыт в [Docker](skills) и [Kubernetes](skills)
      - Мои основные навыки — [машинное обучение](skills), [NLP](skills)
      - Специализируюсь на [Data Science](skills)
      - Работал с [Spark](skills) и [Hadoop](skills)
      - Умею программировать на [C++](skills)

  # Пользователь сообщает о зарплатных ожиданиях
  - intent: provide_salary_expectation
    examples: |
      - Рассчитываю на [120 тысяч](salary)
      - Моя зарплатная вилка — от [90 до 120 тысяч](salary)
      - Ожидаю [100 тысяч рублей](salary)
      - Хочу получать [150 тысяч в месяц](salary)

  # Пользователь сообщает о желаемой должности
  - intent: provide_desired_role
    examples: |
      - Хочу работать [Data Scientist](role)
      - Интересует позиция [Project Manager](role)
      - Хотел бы быть [MLOps Engineer](role)
      - Интересует роль [Data Analyst](role)
      - Думаю, что мне подойдет [Data Engineer](role)

  # Пользователь спрашивает о вакансиях
  - intent: ask_about_roles
    examples: |
      - Какие вакансии у вас есть?
      - Какие открытые позиции есть в компании?
      - Какие должности сейчас актуальны?
      - На какие позиции вы ищете людей?
      - Какие специалисты вам нужны?

  # Пользователь спрашивает о процессе найма
  - intent: ask_about_process
    examples: |
      - Как проходит процесс отбора?
      - Сколько этапов в собеседовании?
      - Как долго идет найм?
      - Какие тестовые задания даете?
      - Когда будет обратная связь?

  # Пользователь спрашивает о компании
  - intent: ask_about_company
    examples: |
      - Чем занимается ваша компания?
      - Какие проекты у вас есть?
      - Какие технологии вы используете?
      - Где находится ваш офис?
      - Можно ли работать удаленно?

  # Пользователь просит связаться с человеком
  - intent: request_human
    examples: |
      - Можно ли поговорить с HR?
      - Мне нужен живой человек
      - Свяжите меня с рекрутером
      - Хочу поговорить с человеком
      - Это важно, могу поговорить с менеджером?

  # Пользователь не уверен в ответе
  - intent: not_sure
    examples: |
      - Я не уверен
      - Не знаю
      - Затрудняюсь ответить
      - Пока не могу сказать

  # Пользователь не заинтересован в вакансии
  - intent: not_interested
    examples: |
      - Меня это не интересует
      - Я не хочу работать в вашей компании
      - Эта позиция мне не подходит
      - Не думаю, что это для меня
      - Я ищу другое направление

  # Пользователь говорит, что у него нет опыта
  - intent: no_experience
    examples: |
      - У меня нет опыта
      - Я только начинаю
      - Я новичок в этой сфере
      - Пока не работал в IT
      - Это моя первая работа



