version: "3.1"

rules:
  - rule: Приветствие и выбор действия
    steps:
      - intent: greet
      - action: utter_greet
      - action: utter_ask_action  # Бот сначала спрашивает, что делать

  - rule: Активировать форму для сбора данных
    steps:
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - rule: Ответить про вакансии
    steps:
      - intent: ask_about_roles
      - action: utter_available_roles  # Бот отвечает про вакансии и ЖДЕТ ответа пользователя

  - rule: Ответить про компанию
    steps:
      - intent: ask_about_company
      - action: utter_contact_hr  # Бот отвечает про компанию и ЖДЕТ ответа пользователя

  - rule: Завершить заполнение формы
    condition:
      - active_loop: hr_form
    steps:
      - action: hr_form
      - active_loop: null
      - action: utter_thank_you



