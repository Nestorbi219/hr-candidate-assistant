version: "3.1"

rules:
  - rule: Приветствие и выбор действия
    steps:
      - intent: greet
      - action: utter_greet
      - action: utter_ask_action  # Теперь бот сначала спрашивает, что делать

  - rule: Активировать форму для сбора данных
    steps:
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - rule: Заполнять слоты формы
    condition:
      - active_loop: hr_form
    steps:
      - action: hr_form


  # - rule: Завершить заполнение формы
  # condition:
  #   - active_loop: hr_form
  # steps:
  #   - action: hr_form
  #   - active_loop: null
  #   - action: utter_thank_you

  - rule: Evaluate candidate after filling form
    condition:
      - active_loop: hr_form
    steps:
      - action: hr_form
      - active_loop: null
      - action: action_evaluate_candidate



