version: "3.0"

rules:
  - rule: Приветствие
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Активировать форму для сбора данных
    steps:
      - intent: provide_info
      - action: hr_form
      - active_loop: hr_form

  - rule: Заполнять слоты формы
    condition:
      - active_loop: hr_form
    steps:
      - action: hr_form

  - rule: Завершить заполнение формы
    condition:
      - active_loop: hr_form
    steps:
      - action: hr_form
      - active_loop: null
      - action: utter_thank_you

