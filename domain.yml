version: '3.1'
intents:
- greet
- goodbye
- thank_you
- provide_info
- provide_experience
- provide_skills
- provide_salary_expectation
- provide_desired_role
- ask_about_roles
- ask_about_process
- ask_about_company
- request_human
- not_sure
- not_interested
- no_experience
- provide_info_again
- positive_answer
- negative_answer
- restart
- nlu_fallback
entities:
- experience
- skills
- salary
- role
slots:
  experience:
    type: float
    influence_conversation: false
    mappings:
    - type: from_text
      intent:
      - provide_experience
      - no_experience
      conditions:
      - active_loop: hr_form
        requested_slot: experience
  salary:
    type: float
    influence_conversation: false
    mappings:
    - type: from_text
      intent: provide_salary_expectation
      conditions:
      - active_loop: hr_form
        requested_slot: salary
  skills:
    type: list
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: skills
      intent: provide_skills
      conditions:
      - active_loop: hr_form
        requested_slot: skills
  role:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: role
forms:
  hr_form:
    required_slots:
    - role
    - experience
    - skills
    - salary
responses:
  utter_ask_action:
  - text: Что вы хотите сделать?
    button_type: vertical
    buttons:
    - title: Оставить информацию о себе
      payload: /provide_info
    - title: Узнать о вакансиях
      payload: /ask_about_roles
    - title: Поговорить с HR
      payload: /request_human
  utter_greet:
  - text: Здравствуйте! Я HR-бот учебного проекта TechNova Solutions. Помогу посмотреть демо-вакансии и заполнить анкету кандидата.
  utter_ask_experience:
  - text: Сколько лет опыта у вас в сфере IT?
  utter_ask_skills:
  - text: Какие ключевые навыки у вас есть?
  utter_ask_salary:
  - text: На какую зарплату рассчитываете?
  utter_ask_role:
  - text: На какую позицию вы хотите податься?
    button_type: vertical
    buttons:
    - title: Data Analyst
      payload: /provide_desired_role{"role":"Data Analyst"}
    - title: Data Scientist
      payload: /provide_desired_role{"role":"Data Scientist"}
    - title: Data Engineer
      payload: /provide_desired_role{"role":"Data Engineer"}
    - title: MLOps Engineer
      payload: /provide_desired_role{"role":"MLOps Engineer"}
    - title: Project Manager
      payload: /provide_desired_role{"role":"Project Manager"}
  utter_thank_you:
  - text: Пожалуйста! Могу показать вакансии или помочь заполнить анкету.
  utter_goodbye:
  - text: Всего доброго! Если будут вопросы, пишите.
  utter_available_roles:
  - text: 'Демо-вакансии:

      • Data Analyst — SQL, Python, BI и аналитика данных.

      • Data Scientist — Python, машинное обучение и статистика.

      • Data Engineer — SQL, Spark и инфраструктура данных.

      • MLOps Engineer — Docker, Kubernetes и ML-пайплайны.

      • Project Manager — Agile, Scrum и управление проектами.

      Выберите интересующую позицию.'
    button_type: vertical
    buttons:
    - title: Data Analyst
      payload: /provide_desired_role{"role":"Data Analyst"}
    - title: Data Scientist
      payload: /provide_desired_role{"role":"Data Scientist"}
    - title: Data Engineer
      payload: /provide_desired_role{"role":"Data Engineer"}
    - title: MLOps Engineer
      payload: /provide_desired_role{"role":"MLOps Engineer"}
    - title: Project Manager
      payload: /provide_desired_role{"role":"Project Manager"}
  utter_contact_hr:
  - text: В этом учебном демо нет настоящего HR-менеджера. В рабочем боте здесь можно указать контакт рекрутера.
  utter_not_sure:
  - text: Можно посмотреть вакансии или начать заново командой /restart. Если заполняете анкету, ответьте на текущий вопрос.
  utter_about_company:
  - text: TechNova Solutions — вымышленная IT-компания для демонстрации HR-бота. Вакансии и требования иллюстративные.
  utter_process:
  - text: Сначала вы выбираете роль, затем указываете опыт, навыки и зарплату. Бот покажет демонстрационное сопоставление с вакансией.
  utter_default:
  - text: Не удалось понять сообщение. Попробуйте переформулировать ответ или начните заново командой /restart.
actions:
- action_reset_slots
- validate_hr_form
- action_evaluate_candidate
- action_show_application_summary
session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
