version: "3.1"

intents:
  - greet
  - goodbye
  - thank_you
  - choose_action
  - provide_name
  - provide_info
  - provide_experience 
  - provide_skills
  - provide_salary_expectation 
  - provide_desired_role
  - ask_about_roles
  - ask_about_process
  - ask_about_company
  - request_human
  - not_sure 
  - not_interested
  - no_experience
  - provide_info_again
  - positive_answer
  - negative_answer

entities:
  - experience
  - skills
  - salary
  - role

slots:
  experience:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: experience
        intent: provide_experience
        not_intent: provide_salary_expectation

  salary:
    type: float
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: salary
        intent: provide_salary_expectation
        not_intent: provide_experience


  skills:
    type: list
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: skills

  role:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: role

forms:
  hr_form:
    required_slots:
      - role
      - experience
      - skills
      - salary

responses:
  utter_salary_confirm:
    - text: "Спасибо, учёл вашу зарплатную ожидание: {salary} рублей."


  utter_ask_action:
    - text: "Что вы хотите сделать?"
      button_type: vertical
      buttons:
        - title: "Оставить информацию о себе"
          payload: "/provide_info"
        - title: "Узнать о вакансиях"
          payload: "/ask_about_roles"
        - title: "Задать вопрос про компанию"
          payload: "/ask_about_company"
        - title: "Поговорить с HR"
          payload: "/request_human"

  utter_greet:
    - text: "Здравствуйте! Я HR-бот. Чем я могу вам помочь?"

  utter_ask_experience:
    - text: "Сколько лет опыта у вас в сфере IT?"

  utter_ask_skills:
    - text: "Какие ключевые навыки у вас есть?"

  utter_ask_salary:
    - text: "На какую зарплату рассчитываете?"

  utter_ask_role:
    - text: "На какую позицию вы хотите податься?"
      button_type: vertical
      buttons:
        - title: "Data Scientist"
          payload: '/provide_desired_role{"role":"Data Scientist"}'
        - title: "Data Engineer"
          payload: '/provide_desired_role{"role":"Data Engineer"}'
        - title: "MLOps Engineer"
          payload: '/provide_desired_role{"role":"MLOps Engineer"}'
        - title: "Project Manager"
          payload: '/provide_desired_role{"role":"Project Manager"}'

  utter_thank_you:
    - text: "Спасибо за информацию! Мы свяжемся с вами позже."
      buttons:
        - title: "🔄 Начать заново"
          payload: "/greet"

  utter_goodbye:
    - text: "Всего доброго! Если будут вопросы, пишите."

  utter_available_roles:
    - text: "У нас есть открытые позиции: Data Scientist, Data Engineer, MLOps, Project Manager, Data Analyst. Что вы хотите сделать дальше?"
#      buttons:
#        - title: "Оставить информацию о себе"
#          payload: "/provide_info"
#        - title: "Узнать о компании"
#          payload: "/ask_about_company"
#        - title: "Поговорить с HR"
#          payload: "/request_human"
#        - title: "Ничего, спасибо"
#          payload: "/goodbye"

  utter_contact_hr:
    - text: "Вы можете связаться с HR-менеджером по email: hr@company.com. Что вы хотите сделать дальше?"
#      buttons:
#        - title: "Оставить информацию о себе"
#          payload: "/provide_info"
#        - title: "Узнать о вакансиях"
#          payload: "/ask_about_roles"
#        - title: "Ничего, спасибо"
#          payload: "/goodbye"


  utter_not_sure:
    - text: "Хорошо, если что-то неясно, дайте знать!"

actions:
  - action_save_candidate_data
  - action_evaluate_candidate
  - action_extract_salary
  - action_extract_experience
  - action_reset_slots

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true