version: "3.1"

intents:
  - greet
  - goodbye
  - thank_you
  - choose_action
  - provide_name
  - provide_info
  - provide_experience 
  - provide_skills
  - provide_salary_expectation 
  - provide_desired_role
  - ask_about_roles
  - ask_about_process
  - ask_about_company
  - request_human
  - not_sure 
  - not_interested
  - no_experience 

entities:
  - experience
  - skills
  - salary
  - role

slots:
  experience:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: experience

  skills:
    type: list
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: skills

  salary:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: salary

  role:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: role

forms:
  hr_form:
    required_slots:
      - role
      - experience
      - skills
      - salary

responses:

  utter_ask_action:
    - text: "Что вы хотите сделать?"
      buttons:
        - title: "Оставить информацию о себе"
          payload: "/provide_info"
        - title: "Узнать о вакансиях"
          payload: "/ask_about_roles"
        - title: "Задать вопрос про компанию"
          payload: "/ask_about_company"
        - title: "Поговорить с HR"
          payload: "/request_human"

  utter_greet:
    - text: "Здравствуйте! Я HR-бот. Давайте уточним информацию о вас."

  utter_ask_experience:
    - text: "Сколько лет опыта у вас в сфере IT?"

  utter_ask_skills:
    - text: "Какие ключевые навыки у вас есть?"

  utter_ask_salary:
    - text: "На какую зарплату рассчитываете?"

  utter_ask_role:
    - text: "Выберите желаемую позицию:"
      buttons:
        - title: "Data Scientist"
          payload: '/provide_desired_role{"role":"Data Scientist"}'
        - title: "Data Engineer"
          payload: '/provide_desired_role{"role":"Data Engineer"}'
        - title: "MLOps Engineer"
          payload: '/provide_desired_role{"role":"MLOps Engineer"}'
        - title: "Project Manager"
          payload: '/provide_desired_role{"role":"Project Manager"}'

  utter_thank_you:
    - text: "Спасибо за информацию! Мы свяжемся с вами позже."

  utter_goodbye:
    - text: "Всего доброго! Если будут вопросы, пишите."

  utter_available_roles:
    - text: "У нас есть открытые позиции: Data Scientist, Data Engineer, MLOps, Project Manager, Data Analyst."

  utter_contact_hr:
    - text: "Вы можете связаться с HR-менеджером по email: hr@company.com."

  utter_not_sure:
    - text: "Хорошо, если что-то неясно, дайте знать!"

actions:
  - action_check_candidate_fit
  - action_save_candidate_data
  - action_evaluate_candidate

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true